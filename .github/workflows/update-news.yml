name: Perbarui berita

on:
  schedule:
    - cron: "17 6 * * 1"   # tiap Senin 06:17 UTC
  workflow_dispatch: {}      # bisa dijalankan manual dari tab Actions
  push:                      # jalan otomatis saat skrip atau workflow ini diubah
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_news.py
      - name: Commit jika ada perubahan
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "Perbarui berita"
            git push
          fi
